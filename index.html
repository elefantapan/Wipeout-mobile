<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Wipeout</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0d1020;color:#fff;font:16px system-ui}</style></head>
<body>Loading…
<script>
Promise.all(['game.html','mobile-patch.html'].map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})))
.then(([g,p])=>{const i=g.lastIndexOf('</body>');document.open();document.write(i<0?g+p:g.slice(0,i)+p+g.slice(i));document.close()})
.catch(e=>{document.body.textContent='Failed to load: '+e.message});
</script></body></html>
